library:
  name: '@michaelrwalker/stagehand'
  version: '0.5.3'
  repository: 'https://github.com/miaklwalker/stagehand'
  description: 'A fully typesafe, saga-style script framework for TypeScript, with a live terminal UI. Scripts are phases of steps; steps optionally compensate when a later step fails; the context accumulates a compile-time type across the whole run.'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'Building a script'
    slug: 'building-scripts'
    description: 'The structural primitives a developer reasons about first — phases, steps, the accumulating typed context, and validating run() input.'

  - name: 'Compensation and context safety'
    slug: 'compensation-safety'
    description: 'The saga guarantees: writing rollbacks, declaring what a rollback may read, removing context a later step does not need, and skipping steps/phases — all of which interlock through the rollbackKeys reservation mechanism.'

  - name: 'Observability while it runs'
    slug: 'observability'
    description: 'Everything a handler can do to narrate its own progress, and where that narration actually lands depending on renderer and logPlacement.'

  - name: 'Caching'
    slug: 'caching'
    description: 'Reusing a phase or step''s prior output across runs: stores, staleness, the shape guard, and reaching a cached slot from inside a later step.'

  - name: 'Reuse and composition'
    slug: 'reuse'
    description: 'Sharing steps and whole phase fragments across scripts and across time: stepFor for one step, routineFor + use() for a mountable group of phases.'

  - name: 'Errors and results'
    slug: 'errors-results'
    description: 'The shape of what run() resolves to, every error class the library defines, and telling a genuine cancellation apart from an ordinary failure.'

skills:
  - name: 'Getting started with a first script'
    slug: 'getting-started'
    domain: 'building-scripts'
    description: 'Build a complete script end to end: an input type, phases, steps that produce and consume typed context, a rollback, and reading the result.'
    type: 'lifecycle'
    covers:
      - 'Script constructor (object or bare string)'
      - 'addPhase / addStep chaining'
      - 'handler return value widening ctx'
      - 'run() and the RunResult union'
    tasks:
      - 'write my first Stagehand script'
      - 'turn an ad-hoc async function chain into a Script'
      - 'understand what run() actually returns'
    failure_modes:
      - mistake: 'wrapping run() in try/catch expecting it to throw on failure'
        mechanism: 'run() resolves to { ok: false, ... } by default; nothing throws unless throwOnError is set, so a try/catch around it never fires and a failed run is silently treated as if nothing happened.'
        wrong_pattern: |
          try {
            const result = await deploy.run(input);
            console.log("deployed", result.ctx.releaseId);
          } catch (e) {
            console.error(e);
          }
        correct_pattern: |
          const result = await deploy.run(input);
          if (!result.ok) {
            console.error(result.error);
            process.exitCode = 1;
            return;
          }
          console.log("deployed", result.ctx.releaseId);
        source: 'docs/guides/script-options-and-result.md; src/script.ts run()'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['getting-started', 'handling-results-and-errors']
      - mistake: 'mutating ctx directly inside a handler instead of returning new keys'
        mechanism: 'ctx is the same live object every handler shares, so a stray `ctx.foo = 1` does not throw — but only a handler''s *return value* is folded into a cached phase''s delta and into a rollback''s rollbackKeys pick, so a directly-mutated key silently never gets cached and is invisible to any rollback that asks for it.'
        wrong_pattern: |
          handler: ({ ctx }) => {
            ctx.total = ctx.total + 1;   // "works" locally, breaks caching/rollback
          }
        correct_pattern: |
          handler: ({ ctx }) => ({ total: ctx.total + 1 })
        source: 'src/script.ts (const ctx = {} as Ctx & Record<string, unknown>; merge() only applied to handler output); docs/guides/cleaning-context.md ("ctx inside a handler is read-only by contract")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['getting-started', 'typed-context-and-input']
      - mistake: 'returning a bare value from a handler instead of an object'
        mechanism: 'a handler must resolve to an object (or nothing) — whatever it returns is merged into ctx by key. An agent used to plain functions returning a single value reaches for `return value` out of habit; TypeScript catches it (Out is constrained to object | void) so it never ships, but it is a very common first-draft mistake that costs an extra iteration.'
        wrong_pattern: |
          handler: () => {
            const value = "me";
            return value;   // compile error — Out must be object | void
          }
        correct_pattern: |
          handler: () => {
            const value = "me";
            return { name: value };
          }
        source: 'src/types.ts StepDef.handler / src/script.ts addStep<Out extends object | void>(...); maintainer interview'
        priority: 'HIGH'
        status: 'active'

  - name: 'Structuring phases and steps'
    slug: 'structuring-phases-and-steps'
    domain: 'building-scripts'
    description: 'addPhase/addStep mechanics, naming rules, per-step retry/timeoutMs, outline(), and why phase boundaries matter beyond visual grouping.'
    type: 'core'
    covers:
      - 'addPhase (flat and callback form)'
      - 'the implicit "Main" phase'
      - 'retry / timeoutMs'
      - 'outline()'
      - 'DuplicateNameError'
    tasks:
      - 'group steps into phases'
      - 'add retry with backoff to a flaky step'
      - 'add a timeout to a step'
      - 'inspect a script''s declared structure without running it'
    failure_modes:
      - mistake: 'reusing a step name within the same phase (e.g. copy-pasted step)'
        mechanism: 'a step name must be unique within its own phase; the same name in two different phases is fine, but a duplicate inside one phase throws DuplicateNameError at build time, before run() is ever called.'
        wrong_pattern: |
          .addStep({ name: "validate", handler: checkA })
          .addStep({ name: "validate", handler: checkB })  // DuplicateNameError
        correct_pattern: |
          .addStep({ name: "validate input", handler: checkA })
          .addStep({ name: "validate permissions", handler: checkB })
        source: 'src/script.ts addStep() DuplicateNameError check; docs/reference/errors.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'never calling addPhase, then relying on rollback: "phase" to scope compensation'
        mechanism: 'addStep creates an implicit "Main" phase the first time it is called if addPhase was never used. With every step in one phase, rollback: "phase" and rollback: "all" unwind identically, since there is only one phase to unwind.'
        wrong_pattern: |
          new Script({ name: "t", rollback: "phase" })
            .addStep(stepA).addStep(stepB).addStep(stepC)
          // rollback: "phase" here behaves exactly like "all" — one phase, "Main"
        correct_pattern: |
          new Script({ name: "t", rollback: "phase" })
            .addPhase("Prepare").addStep(stepA)
            .addPhase("Commit").addStep(stepB).addStep(stepC)
        source: 'src/script.ts currentPhase() implicit "Main"; docs/guides/phases-and-steps.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['structuring-phases-and-steps', 'adding-rollbacks']
      - mistake: 'chaining .addStep() directly after .use() without opening a new phase'
        mechanism: 'a routine owns whole phases; the last phase spliced in by use() belongs to the fragment, so a bare addStep right after it is refused at build time with StepDefinitionError, even though the fluent chain reads naturally.'
        wrong_pattern: |
          new Script({ name: "t" })
            .use(pullChannel)
            .addStep({ name: "sneaky", handler: () => ({}) });
          // StepDefinitionError: Cannot add a step after use()
        correct_pattern: |
          new Script({ name: "t" })
            .use(pullChannel)
            .addPhase("Report")
            .addStep({ name: "summarize", handler: ({ ctx }) => ({}) });
        source: 'src/script.ts currentPhase() StepDefinitionError; docs/guides/reusable-scripts.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['structuring-phases-and-steps', 'reusable-routines-and-mounts']
      - mistake: 'wrapping the whole script in one giant step (or one giant phase) instead of decomposing the work'
        mechanism: 'the entire value of phases and steps — incremental typed context, phase-scoped rollback, per-step retry/caching/observability — only shows up when work is actually split along its natural boundaries. An agent porting existing imperative code tends to drop it into a single handler wholesale ("use the framework to wrap my script") rather than decomposing it into distinct steps ("use the framework to write my script"), which produces a script that compiles and runs but gets none of the library''s actual benefits: one opaque step with no per-stage rollback, no per-stage cache, and a phase tree that renders as a single spinner instead of legible progress.'
        wrong_pattern: |
          new Script<Input>({ name: "deploy" })
            .addStep({
              name: "deploy",
              handler: async ({ input }) => {
                const sha = await resolveSha(input.ref);
                const artifact = await compile();
                const uploadId = await upload(artifact);
                await shiftTraffic(uploadId);
                return { uploadId };
              },
            });
        correct_pattern: |
          new Script<Input>({ name: "deploy" })
            .addPhase("Validation").addStep({ name: "resolve commit", handler: … })
            .addPhase("Build").addStep({ name: "compile bundle", handler: … })
            .addPhase("Release")
            .addStep({ name: "upload artifact", handler: …, rollbackKeys: ["sha"], rollback: … })
            .addStep({ name: "shift traffic", handler: … });
        source: 'maintainer interview ("not breaking things into distinct enough stages... writing a whole script around the framework instead of using the framework to write the whole script")'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'The typed context and validated input'
    slug: 'typed-context-and-input'
    domain: 'building-scripts'
    description: 'How ctx accumulates purely from handler return types with no hand-written generic, the input/ctx distinction, and defineInput for runtime-validated input via any Standard Schema library.'
    type: 'core'
    reference_candidates:
      - topic: 'Merge / Cleaned / Prettify type-level utilities'
        reason: 'small but dense type machinery worth a focused reference if agents start hand-writing intersections instead of relying on inference'
    covers:
      - 'context widening on addStep'
      - 'input vs ctx'
      - 'defineInput + Standard Schema'
      - 'SchemaValidationError'
    tasks:
      - 'validate run() input with Zod/Valibot/ArkType'
      - 'understand why a key is missing from ctx'
      - 'know when input.x vs ctx.x is the right read'
    failure_modes:
      - mistake: 'calling defineInput after one or more addStep/addPhase calls, expecting it to retype everything'
        mechanism: 'defineInput returns a re-typed Script; it does not retroactively change steps already added, which still see the old In. Must be called first, immediately after construction.'
        wrong_pattern: |
          new Script({ name: "t" })
            .addStep({ name: "one", handler: ({ input }) => ({}) })  // sees old In
            .defineInput(z.object({ service: z.string() }));
        correct_pattern: |
          new Script({ name: "t" })
            .defineInput(z.object({ service: z.string() }))
            .addStep({ name: "one", handler: ({ input }) => ({}) });  // input.service: string
        source: 'docs/guides/typed-context.md; src/script.ts defineInput()'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'assuming a failed defineInput validation shows up in RunResult like a step failure'
        mechanism: 'SchemaValidationError is always thrown directly by run(), never returned as { ok: false }, and is unaffected by throwOnError — there is no partial result to produce since no phase executed.'
        wrong_pattern: |
          const result = await deploy.run(rawInput);
          if (!result.ok) { /* never reached on bad input — it throws instead */ }
        correct_pattern: |
          try {
            const result = await deploy.run(rawInput);
          } catch (error) {
            if (error instanceof SchemaValidationError) console.error(error.issues);
            else throw error;
          }
        source: 'docs/guides/typed-context.md; docs/reference/errors.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['typed-context-and-input', 'handling-results-and-errors']

  - name: 'Adding rollbacks'
    slug: 'adding-rollbacks'
    domain: 'compensation-safety'
    description: 'Writing a rollback, declaring rollbackKeys (what it narrows and what it permanently reserves), rollback scope (all/phase/none), what a rollback can and cannot see, and cancellation.'
    type: 'core'
    covers:
      - 'rollback / rollbackKeys'
      - 'ScriptOptions.rollback scope'
      - 'the rollback context object'
      - 'handleSignals / AbortSignal'
    tasks:
      - 'add a compensation to a mutation step'
      - 'debug why a rollback can''t see a context key'
      - 'scope how far a failure unwinds'
      - 'cancel a running script from outside'
    failure_modes:
      - mistake: 'writing defensive rollback logic for the step that itself failed'
        mechanism: 'the step that actually failed never completed, so it is never compensated — only steps that already succeeded are unwound, in reverse order.'
        wrong_pattern: |
          .addStep({
            name: "charge card",
            handler: () => { throw new Error("declined"); },
            rollback: () => refund(),  // never runs — this step never succeeded
          })
        correct_pattern: |
          .addStep({
            name: "reserve funds",
            handler: async ({ ctx }) => ({ reservationId: await reserve(ctx.accountId) }),
            rollbackKeys: ["accountId"],
            rollback: async ({ ctx, output }) => release(ctx.accountId, output.reservationId),
          })
          .addStep({ name: "charge card", handler: () => { throw new Error("declined"); } })
        source: 'docs/guides/rollbacks.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'expecting a rollback to see the full context without declaring rollbackKeys'
        mechanism: 'a rollback gets no context at all by default; it has to name every key it needs through rollbackKeys, which both narrows and reserves them.'
        wrong_pattern: |
          .addStep({
            name: "reserve funds",
            handler: async ({ ctx }) => ({ reservationId: await reserve(ctx.accountId) }),
            rollback: async ({ ctx }) => release(ctx.accountId, ctx.reservationId),
            //                  ^ both are `undefined` — ctx is {}
          })
        correct_pattern: |
          .addStep({
            name: "reserve funds",
            handler: async ({ ctx }) => ({ reservationId: await reserve(ctx.accountId) }),
            rollbackKeys: ["accountId", "reservationId"],
            rollback: async ({ ctx }) => release(ctx.accountId, ctx.reservationId),
          })
        source: 'docs/guides/rollbacks.md; test/rollback-keys.test.ts'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'assuming a rollback that throws replaces or masks result.error'
        mechanism: 'a failing rollback is recorded as { ok: false, error } inside result.rollbacks; result.error always stays the original failure that triggered the unwind, and the remaining rollbacks still run.'
        wrong_pattern: |
          const result = await script.run(input);
          if (!result.ok) console.error(result.error); // assumed to be the rollback's error if one failed
        correct_pattern: |
          const result = await script.run(input);
          if (!result.ok) {
            console.error("run failed:", result.error);
            for (const r of result.rollbacks) if (!r.ok) console.error("rollback failed:", r.step, r.error);
          }
        source: 'docs/guides/rollbacks.md; docs/reference/errors.md (RollbackFailedError)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['adding-rollbacks', 'handling-results-and-errors']
      - mistake: 'treating any Error named "AbortError" from inside a handler as a script cancellation'
        mechanism: 'isAbort(), used internally by executeStep''s retry loop, returns true for a ScriptAbortedError OR any Error whose name is exactly "AbortError" — not just ones tied to the script''s own signal. A handler that runs its own fetch with an unrelated AbortController (e.g. a hand-rolled per-call timeout) will throw a DOM AbortError that Stagehand treats as a cancellation, skipping retry/retryIf entirely, even though nothing about the script itself was aborted.'
        wrong_pattern: |
          handler: async ({ signal }) => {
            const localController = new AbortController();
            setTimeout(() => localController.abort(), 200);       // unrelated to `signal`
            return fetch(url, { signal: localController.signal }); // throws AbortError → retry silently skipped
          },
          retry: { attempts: 3 },
        correct_pattern: |
          handler: async ({ signal }) => fetch(url, { signal }),  // forward the step's own signal
          retry: { attempts: 3, retryIf: (error) => !isAbort(error) },
        source: 'src/errors.ts isAbort(); src/script.ts executeStep() (isAbort check precedes the retry-budget check)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['adding-rollbacks', 'handling-results-and-errors']
      - mistake: 'writing a rollback that reaches beyond its own step to compensate for what another step did'
        mechanism: 'a rollback should be scoped to exactly what its own step did — and should only be written once you understand everything that step needs undone. Compensation for the whole script is already handled by the natural reverse-order unwind, where each completed step''s own rollback fires for its own side effects; a rollback that also tries to clean up another step''s work duplicates that step''s own compensation (double-undoing it) or does it with less context than the responsible step actually had.'
        wrong_pattern: |
          .addStep({
            name: "reserve funds",
            handler: async ({ ctx }) => ({ reservationId: await reserve(ctx.accountId) }),
            rollback: async ({ ctx }) => {
              await release(ctx.reservationId);
              await notifyUser(ctx.accountId);   // "charge card"'s concern, not this step's
            },
          })
          .addStep({ name: "charge card", handler: chargeCard, rollback: async () => notifyUser(ctx.accountId) })
        correct_pattern: |
          .addStep({
            name: "reserve funds",
            handler: async ({ ctx }) => ({ reservationId: await reserve(ctx.accountId) }),
            rollbackKeys: ["reservationId"],
            rollback: async ({ ctx }) => release(ctx.reservationId),   // only what this step did
          })
          .addStep({
            name: "charge card",
            handler: chargeCard,
            rollback: async () => notifyUser(),   // its own concern, compensated independently
          })
        source: 'maintainer interview ("rollback steps should be written when you understand everything a step must do to properly rollback... scoped to the specific step it is supposed to rollback so side effects that affect other steps aren''t included")'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Cleaning context keys'
    slug: 'cleaning-context'
    domain: 'compensation-safety'
    description: 'clean removes keys from both the runtime context and the type every later step sees, and interacts strictly with rollbackKeys reservation.'
    type: 'core'
    covers:
      - 'clean field on addStep'
      - 'reserved-key StepDefinitionError'
      - 'clean under when-skip and under a cache hit'
    tasks:
      - 'drop a secret from context once it''s no longer needed'
      - 'understand why clean rejects a key'
    failure_modes:
      - mistake: 'trying to clean a key the step itself just produced'
        mechanism: 'clean is checked against the context as it stands entering the step, before the handler''s own output is merged — a step''s own output does not exist yet at the point clean is evaluated, so it is a compile error to list it.'
        wrong_pattern: |
          .addStep({
            name: "s",
            handler: ({ ctx }) => ({ temp: ctx.a * 10 }),
            clean: ["temp"],  // compile error — "temp" is this step's output, not its input
          })
        correct_pattern: |
          .addStep({ name: "s", handler: ({ ctx }) => ({ temp: ctx.a * 10 }) })
          .addStep({ name: "next", handler: () => ({}), clean: ["temp"] })
        source: 'docs/guides/cleaning-context.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'cleaning a key reserved by rollbackKeys, including from the same step that reserved it'
        mechanism: 'once a key is reserved by any step''s rollbackKeys, no step — including that one — may list it in clean, for the rest of the script, across phase boundaries. Throws StepDefinitionError at addStep, at build time.'
        wrong_pattern: |
          .addStep({ name: "one", handler: () => {}, rollbackKeys: ["a"], rollback: async () => {} })
          .addStep({ name: "two", handler: () => {}, clean: ["a"] });
          // StepDefinitionError: reserved by rollbackKeys
        correct_pattern: |
          .addStep({ name: "one", handler: () => {}, rollbackKeys: ["a"], rollback: async () => {} })
          .addStep({ name: "two", handler: () => {} })  // leave "a" alone; it stays reserved
        source: 'src/script.ts addStep() conflicts check; docs/guides/cleaning-context.md; test/rollback-keys.test.ts'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['cleaning-context', 'adding-rollbacks']
      - mistake: 'assuming a skipped step (when: false) does not run its clean'
        mechanism: 'clean is part of the declared shape of the context, not of the work performed, so it applies even when the step is skipped by when — runtime and types never disagree about what a skipped step removed.'
        wrong_pattern: |
          // developer expects `secret` to survive because "optional" never ran
          .addStep({ name: "seed", handler: ({ input }) => ({ secret: input.secret }) })
          .addStep({ name: "optional", when: () => false, handler: () => ({}), clean: ["secret"] })
          .addStep({ name: "later", handler: ({ ctx }) => { ctx.secret; /* compile error — gone */ } });
        correct_pattern: |
          // if "secret" should only be dropped when "optional" actually ran, clean elsewhere
          .addStep({ name: "seed", handler: ({ input }) => ({ secret: input.secret }) })
          .addStep({ name: "optional", when: () => false, handler: () => ({}) })
          .addStep({ name: "use it then drop it", handler: ({ ctx }) => ({}), clean: ["secret"] });
        source: 'docs/guides/cleaning-context.md; src/script.ts phaseLoop skip branch (drop(ctx, item.def.clean))'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['cleaning-context', 'conditional-steps']

  - name: 'Conditional steps and phases'
    slug: 'conditional-steps'
    domain: 'compensation-safety'
    description: 'when on a step or a whole phase, skip semantics, and how skipping interacts with rollback and mounts.'
    type: 'core'
    covers:
      - 'when on addStep / addPhase'
      - 'StepStatus "skipped"'
    tasks:
      - 'run a step only in production'
      - 'skip a whole phase based on input'
    failure_modes:
      - mistake: 'expecting a skipped step''s rollback to run because the step "technically executed" some logic'
        mechanism: 'when resolving falsy marks the step (or every step in a skipped phase) as skipped; its rollback never runs, because a skipped step never did anything to compensate for.'
        wrong_pattern: |
          .addStep({
            name: "notify slack",
            when: ({ input }) => input.environment === "production",
            handler: async () => notify(),
            rollback: async () => undoNotify(), // assumed to fire if a later step fails and this was "run"
          })
        correct_pattern: |
          // rely on `when` purely as a gate; don't design a rollback around a skip firing it
          .addStep({
            name: "notify slack",
            when: ({ input }) => input.environment === "production",
            handler: async () => notify(),
            rollback: async () => undoNotify(), // correct: only fires if this step actually ran and succeeded
          })
        source: 'docs/guides/phases-and-steps.md'
        priority: 'LOW'
        status: 'active'
      - mistake: 'assuming a step-level when can re-enable a step inside a phase already skipped by phase-level when'
        mechanism: 'phase-level when is evaluated once; if it resolves falsy, every step in the phase is marked skipped without ever evaluating that step''s own when — there is no per-step override of a phase-level skip.'
        wrong_pattern: |
          .addPhase("Release", { when: ({ input }) => input.environment === "production" })
          .addStep({ name: "always run this", when: () => true, handler: async () => {} })
          // still skipped — the phase gate short-circuits before step.when is ever checked
        correct_pattern: |
          // move a step that must always run outside the conditional phase
          .addPhase("Always")
          .addStep({ name: "always run this", handler: async () => {} })
          .addPhase("Release", { when: ({ input }) => input.environment === "production" })
        source: 'src/script.ts run() phaseLoop (phase.options.when checked before any step.when)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'writing when inside a mounted routine as if it saw the host''s own input'
        mechanism: 'a mount''s input is resolved once, when the mount is reached, from either a fixed value or an {input, ctx} => SubIn mapper; every when inside that fragment (phase- or step-level) is evaluated against the mount''s resolved input, not the host script''s.'
        wrong_pattern: |
          // inside routines/channel.ts, built with routineFor<{channel: string}>()
          .addStep({ name: "gate", when: ({ input }) => input.hostOnlyFlag, handler: async () => {} })
          // TypeScript already prevents referencing hostOnlyFlag if routineFor's In doesn't include it —
          // but this is exactly the trap when In is loosely typed or the mapper over-forwards fields
        correct_pattern: |
          export const pullChannel = routineFor<{ channel: string; since: string }>()(
            "pull channel",
            (script) => script.addStep({ name: "gate", when: ({ input }) => input.channel === "amazon", handler: async () => {} }),
          );
        source: 'docs/guides/reusable-scripts.md ("Giving a mount its own input"); src/script.ts use()/run() mount input resolution'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['conditional-steps', 'reusable-routines-and-mounts']

  - name: 'Reporting progress from a step'
    slug: 'reporting-progress'
    domain: 'observability'
    description: 'The handler UI surface: status/note/progress/task/tasks and the log methods, and the status-vs-note distinction that trips up most first drafts.'
    type: 'core'
    covers:
      - 'status(text) vs note(text)'
      - 'progress({ total, label })'
      - 'task(label) / tasks([...] as const)'
      - 'log/info/warn/error/success'
    tasks:
      - 'show a progress bar for a long-running upload'
      - 'put a row count on the finished step line'
      - 'run a typed checklist inside one step'
    failure_modes:
      - mistake: 'using status() for a value meant to persist on the finished step line'
        mechanism: 'status is scratch space for a step in flight — it is wiped the instant the step settles (success or failure). Only note() survives onto the finished line.'
        wrong_pattern: |
          handler: async ({ status }) => {
            const rows = await db.all(sql);
            status(`${rows.length} rows found`);  // gone the moment this step finishes
            return { rows };
          }
        correct_pattern: |
          handler: async ({ status, note }) => {
            status("scanning");
            const rows = await db.all(sql);
            note(`${rows.length} rows found`);  // stays on the finished line
            return { rows };
          }
        source: 'docs/guides/handler-surface.md; src/script.ts (delete item.state.statusText on success/failure)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'calling note() repeatedly expecting it to append, like a log'
        mechanism: 'note replaces whatever it previously set; it is not cumulative. note("") clears it.'
        wrong_pattern: |
          note("400 rows");
          note("2 skipped");  // "400 rows" is gone — the title now reads "2 skipped"
        correct_pattern: |
          note(`${rowCount} rows, ${skipped} skipped`);
        source: 'docs/guides/handler-surface.md'
        priority: 'LOW'
        status: 'active'
      - mistake: 'passing a plain string[] (not `as const`) to tasks()'
        mechanism: 'tasks(labels) needs the label list as a const tuple for list.get(key) to be typed to exactly those labels; a widened string[] makes get() accept any string, including a typo, without a compile error.'
        wrong_pattern: |
          const labels = ["typecheck", "transform", "minify"];
          const list = tasks(labels);
          list.get("tpyecheck");  // typo compiles — labels was string[], not a literal tuple
        correct_pattern: |
          const list = tasks(["typecheck", "transform", "minify"] as const);
          list.get("tpyecheck");  // compile error
        source: 'docs/guides/handler-surface.md'
        priority: 'LOW'
        status: 'active'
      - mistake: 'passing a value outside [0, total] to progress and expecting an error or warning'
        mechanism: 'update/increment/setTotal all clamp silently to the valid range rather than throwing, so an off-by-one or unit mismatch in the caller''s own math shows up only as a bar stuck at 0% or 100% with no diagnostic.'
        wrong_pattern: |
          const bar = progress({ total: 100 });
          bar.update(bytesUploaded);  // bytesUploaded is actually in KB — silently clamps to 100
        correct_pattern: |
          const bar = progress({ total: totalBytes });
          bar.update(bytesUploaded);  // units matched to `total`
        source: 'src/context.ts createProgress() (clamp(...))'
        priority: 'LOW'
        status: 'active'

  - name: 'Log placement and terminal rendering'
    slug: 'log-placement-and-rendering'
    domain: 'observability'
    description: 'logPlacement modes, and how the live TTY frame differs from the plain/CI renderer — including which behaviors only exist in one of the two.'
    type: 'core'
    covers:
      - 'logPlacement: scrollback / step / bottom'
      - 'live vs plain renderer selection (TTY + color detection)'
      - 'plain / silent ScriptOptions'
      - 'symbols / palette / formatDuration'
    tasks:
      - 'nest a rollback''s log lines under the step it''s undoing'
      - 'force plain output for CI'
      - 'match custom console output to the script''s own styling'
    failure_modes:
      - mistake: 'relying on logPlacement: "step" or "bottom" as the complete record of a run'
        mechanism: 'both trade completeness for locality and keep only the most recent handful of lines per step or per run; "scrollback" (default) is the one placement that is guaranteed complete.'
        wrong_pattern: |
          new Script({ name: "audit", logPlacement: "bottom" })
          // assumed every log() call is retrievable after the run for compliance review
        correct_pattern: |
          new Script({ name: "audit", logPlacement: "scrollback" })
        source: 'docs/guides/handler-surface.md; docs/guides/terminal-rendering.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'assuming logPlacement behaves identically in CI as it did locally'
        mechanism: 'only the live renderer honors logPlacement; the plain/CI renderer (chosen automatically off a TTY, under NO_COLOR, or TERM=dumb) is already sequential and prints every line immediately in order regardless of the setting.'
        wrong_pattern: |
          // developer tunes `logPlacement: "step"` by eye in a local terminal,
          // then is confused that CI logs show every line in plain top-level order instead
        correct_pattern: |
          // treat logPlacement as a live-TTY-only concern; CI output is always flat and complete
        source: 'docs/guides/terminal-rendering.md; docs/guides/handler-surface.md'
        priority: 'LOW'
        status: 'active'
      - mistake: 'hardcoding Stagehand''s glyphs (✔, ⠸, etc.) into a script''s own console output'
        mechanism: 'Stagehand degrades its own symbols automatically on terminals without solid Unicode support; that degradation is internal to the renderer and is not applied to anything a script prints itself unless it goes through the exported `symbols`/`palette` helpers.'
        wrong_pattern: |
          console.log(`✔ done`);  // renders as mojibake on the same terminals Stagehand degrades for
        correct_pattern: |
          import { symbols, palette } from "@michaelrwalker/stagehand";
          console.log(`${symbols.success} done`);
        source: 'docs/guides/terminal-rendering.md'
        priority: 'LOW'
        status: 'active'

  - name: 'Caching expensive work'
    slug: 'caching-expensive-work'
    domain: 'caching'
    description: 'fileStore/memoryStore, stale/schema, per-run CacheMode, and reaching the cache handle (read/write/clear/ageOf) from inside a later step or rollback.'
    type: 'core'
    reference_candidates:
      - topic: 'CacheStore / CacheOptions / CacheHandle full type surface'
        reason: 'dense enough (2 stores, 4 handle methods, stale/schema/keepAge/raw options) to warrant its own reference file alongside the skill'
    covers:
      - 'fileStore(path) / memoryStore()'
      - 'stale / schema'
      - 'CacheMode: on/off/refresh/read-only'
      - 'context.cache: read/write/clear/ageOf'
      - 'CacheShapeError'
    tasks:
      - 'skip re-running an expensive phase across runs'
      - 'invalidate a cache entry from inside a later step'
      - 'correct a cached value without resetting its TTL'
      - 'guard a cache entry against an old script shape'
    failure_modes:
      - mistake: 'conditionally caching a step with `cache: condition ? store : undefined` instead of controlling caching through run()'
        mechanism: 'addStep has a separate overload for a cached step that requires `cache` to be a concrete CacheSource; a value typed `CacheStore | undefined` does not satisfy it, so TypeScript silently falls back to the plain (uncached-looking) overload — the step still caches at runtime whenever the value is truthy, but context.cache has no typed slot for it. There is essentially never a good reason to reach for this: the library already has a dedicated, properly-typed mechanism for turning caching on/off per run without touching the script — RunOptions.cache (CacheMode: "on"/"off"/"refresh"/"read-only"), exactly as shown in the caching guide''s own `--no-cache` example. An agent should always declare a concrete store on the step and control activation from the run() call site instead of ever writing a ternary into `cache:`.'
        wrong_pattern: |
          .addStep({
            name: "build",
            cache: isProd ? store : undefined,   // no compile error, but no typed slot either
            handler: async () => ({ artifact: await build() }),
          })
          // later: context.cache.clear("build") — compile error, "build" is not a known slot
        correct_pattern: |
          .addStep({
            name: "build",
            cache: { store },                       // always a concrete CacheSource — gets a typed slot
            handler: async () => ({ artifact: await build() }),
          })
          // toggle it from the call site instead, with the mechanism built for exactly this:
          await script.run(input, { cache: isProd ? "on" : "off" });
        source: 'src/script.ts addStep() overloads (comment: "an optional property cannot be told apart from its own default, so a single signature always resolved to no cache and quietly dropped the slot"); docs/guides/caching.md ("Per-run cache control"); maintainer interview'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'calling cache.clear() mid-run and expecting the already-executed phase to re-run in this run'
        mechanism: 'invalidation only affects the *next* run that reads the slot; within the current run, a phase that has already executed (or already hit cache) does not re-execute just because a later step cleared its entry.'
        wrong_pattern: |
          .addStep({
            name: "restock",
            handler: async ({ ctx, cache }) => {
              await cache.clear("Fetch");
              // assumed: "Fetch" now redoes its work this run — it does not
            },
          })
        correct_pattern: |
          // clear now, and let the *next* invocation of the script get the miss
          .addStep({
            name: "restock",
            handler: async ({ ctx, cache }) => {
              await cache.clear("Fetch");  // takes effect starting next run
            },
          })
        source: 'docs/guides/caching.md ("Reaching the cache from a step"); src/script.ts run() (cache read only happens once, before a phase''s steps execute)'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'letting a CacheShapeError-guarded value travel into ctx without { raw: true }, then being confused where the throw comes from'
        mechanism: 'the shape guard on cache.read wraps the value in a Proxy that throws CacheShapeError the moment a missing field is actually touched — including from a step several hops downstream that just reads it off ctx, far from the original cache.read() call.'
        wrong_pattern: |
          const stored = await cache.read("Fetch");
          return { orders: stored };  // guard travels into ctx.orders
          // three steps later: ctx.orders[0].newField throws CacheShapeError there, not here
        correct_pattern: |
          const stored = await cache.read("Fetch", { raw: true });  // opt out before it enters ctx
          return { orders: stored };
        source: 'docs/guides/caching.md ("The shape guard"); src/cache.ts guardShape()'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'relying on caching to guarantee an expensive/rate-limited call never runs twice'
        mechanism: 'a store that throws — an unreadable file, a full disk, a buggy stale predicate — logs a warning and lets the work run anyway; caching never decides whether a run passes or fails, so it is not a hard guarantee against re-execution.'
        wrong_pattern: |
          // assumes fileStore failure = the run fails loudly, so a "guaranteed once" API call is safe to put behind cache alone
          .addStep({ cache: { store: fileStore("./cache.json") }, handler: () => callRateLimitedApi() })
        correct_pattern: |
          // add an idempotency key or rate-limit handling in the handler itself; treat cache as an optimization, not a guarantee
          .addStep({ cache: { store: fileStore("./cache.json") }, handler: () => callRateLimitedApi({ idempotencyKey }) })
        source: 'docs/guides/caching.md ("A store that throws... logs a warning and does the work")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['caching-expensive-work']
      - mistake: 'calling cache.write to patch a value without keepAge'
        mechanism: 'write restamps the entry as written now unless keepAge is passed — a correction that resets the clock silently buys another full staleness window for data that is exactly as old as it was a moment ago.'
        wrong_pattern: |
          await cache.write("Fetch", { orders: corrected }); // resets the TTL clock
        correct_pattern: |
          await cache.write("Fetch", { orders: corrected }, { keepAge: true });
        source: 'docs/guides/caching.md; docs/reference/cache.md'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Splitting steps across files'
    slug: 'splitting-steps-across-files'
    domain: 'reuse'
    description: 'stepFor binds the In/Ctx a step declared outside any script expects, and WithStepFor composes a chain''s context without restating each step''s output by hand. The strongest reason to reach for this: a small shared library of narrow, composable steps pays for itself fast and costs nothing in type safety.'
    type: 'core'
    covers:
      - 'stepFor<In, Ctx>()'
      - 'WithStepFor<Step, Rest>'
      - 'building a shared step library for a recurring workflow'
    tasks:
      - 'move a step into its own module so two scripts can share it'
      - 'chain several stepFor-declared steps without hand-typing Ctx each time'
      - 'build a reusable steps file for a workflow you write scripts against often (e.g. CRM contact operations)'
    failure_modes:
      - mistake: 'nesting WithStepFor in the reverse of the actual execution order'
        mechanism: 'on a name collision between nested WithStepFor calls, the outermost wins — matching how a later step''s return value shadows an earlier key at runtime. Nothing checks that the nesting order actually matches the order the steps are added to a real script, so a reversed nest silently produces a type that disagrees with runtime shadowing.'
        wrong_pattern: |
          // "second" actually runs after "first" in the real script, but is nested as if it ran before it
          type Ctx = WithStepFor<typeof first, WithStepFor<typeof second, { conditions: string[] }>>;
        correct_pattern: |
          // nest in the order the steps actually run — innermost first
          type Ctx = WithStepFor<typeof second, WithStepFor<typeof first, { conditions: string[] }>>;
        source: 'docs/guides/splitting-steps.md ("nothing checks that the steps are added to a script in the order the nesting implies")'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'assuming a stepFor step reused across two scripts gets independent state each time'
        mechanism: 'it is the exact same function/object reference in both scripts; any module-scoped mutable state a handler closes over (a counter, a shared client, a cache store) is shared across every script that imports and mounts it, not reset per mount.'
        wrong_pattern: |
          // steps/tenancy.ts
          let callCount = 0;
          export const createTenant = stepFor<Input, { account: Account }>()({
            name: "create tenant",
            handler: async () => { callCount++; return { tenantId: await api.create() }; },
          });
          // callCount keeps incrementing across every script that imports createTenant
        correct_pattern: |
          // keep per-run state inside ctx/output, not module-level closures, unless sharing is intended
          export const createTenant = stepFor<Input, { account: Account }>()({
            name: "create tenant",
            handler: async ({ attempt }) => ({ tenantId: await api.create(), attempt }),
          });
        source: 'docs/guides/splitting-steps.md ("Reusing one step in two scripts" — same function reference each time)'
        priority: 'LOW'
        status: 'active'
      - mistake: 'writing a narrow, script-specific step closure instead of extracting a small, composable one into a shared steps file'
        mechanism: 'for a workflow that comes up repeatedly (e.g. "update CRM contacts"), a step written once with a simple, generic input — stepFor<{ emails: string[] }>()({ name: "fetch contacts", ... }) — composes into every future script that touches the same workflow, at zero type-safety cost: addStep still checks it against whatever script mounts it. Writing a fresh, bespoke step inline every time forfeits that entirely — logic (and any bugs or fixes in it) has to be re-written and re-verified per script instead of once, in one shared place.'
        wrong_pattern: |
          // scripts/sync-a.ts
          .addStep({ name: "fetch contacts", handler: async ({ input }) => ({ contacts: await crm.fetch(input.emails) }) })
          // scripts/sync-b.ts — same logic, retyped, now two places to fix a bug
          .addStep({ name: "fetch contacts", handler: async ({ input }) => ({ contacts: await crm.fetchContacts(input.emails) }) })
        correct_pattern: |
          // steps/crm.ts — written once, with a small, generic input
          export const fetchContacts = stepFor<{ emails: string[] }>()({
            name: "fetch contacts",
            handler: async ({ input }) => ({ contacts: await crm.fetch(input.emails) }),
          });
          // any script that needs it:
          .addStep(fetchContacts)
        source: 'maintainer interview ("keep a file of common steps, with simple inputs so you can easily compose scripts... this will save developers a ton of time and costs nothing as far as type safety is concerned")'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Reusable routines and mounts'
    slug: 'reusable-routines-and-mounts'
    domain: 'reuse'
    description: 'routineFor declares a mountable group of phases; use() splices it (or a plain Script) into a host, with optional renaming and per-mount input mapping.'
    type: 'core'
    covers:
      - 'routineFor<In, Ctx>()'
      - '.use(routine | script, { as?, input? })'
      - 'mounting a plain Script'
      - 'multi-mount with as'
    tasks:
      - 'share a "fetch and normalize" pipeline across two unrelated scripts'
      - 'mount the same routine twice for two different storefronts/tenants'
      - 'feed a mounted fragment something other than the host''s own input'
    failure_modes:
      - mistake: 'mounting the same routine twice without as'
        mechanism: 'phase names must stay unique across the whole script; mounting the same routine a second time without a distinguishing as prefix throws DuplicateNameError at build time.'
        wrong_pattern: |
          .use(pullChannel)
          .use(pullChannel)  // DuplicateNameError: "Fetch" already defined
        correct_pattern: |
          .use(pullChannel, { as: "Amazon", input: ({ input }) => ({ ...input, channel: "amazon" }) })
          .use(pullChannel, { as: "Shopify", input: ({ input }) => ({ ...input, channel: "shopify" }) })
        source: 'docs/guides/reusable-scripts.md; docs/reference/errors.md (DuplicateNameError)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'giving a routine its own ScriptOptions (rollback mode, logPlacement, silent) expecting them to hold once mounted'
        mechanism: 'a mounted Script''s own ScriptOptions are ignored in favor of the host''s; only its phases and steps come across. This is expected, by design — a standalone Script is meant to be runnable on its own today and mountable into something bigger tomorrow, and the host has to be the one governing the whole run. Worth a passing note (a "fun fact" more than a warning) so an agent isn''t surprised to find rollback/logPlacement/silent set on a Script that later gets mounted and behaves as if they weren''t there.'
        wrong_pattern: |
          // routines/import.ts
          const pipeline = new Script({ name: "import", rollback: "none" })
            .addPhase("Fetch").addStep({ name: "pull", handler, rollback: undoPull });
          // mounted into a host with rollback: "all" — the host's "all" wins; "pull"'s rollback CAN fire
        correct_pattern: |
          // a mountable fragment's own ScriptOptions are dead weight once mounted — fine to leave them off,
          // and expect whichever script mounts it to own rollback/logPlacement/silent for the whole run
        source: 'docs/guides/reusable-scripts.md ("A mounted Script''s own ScriptOptions... are ignored in favor of the host''s"); maintainer interview ("standalone scripts can be mounted or run, but just leave that in as a note, or fun fact")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['reusable-routines-and-mounts', 'adding-rollbacks']
      - mistake: 'renaming a mount with `as` and forgetting to update cache.clear/read/write calls written against the original phase name'
        mechanism: 'as renames a mounted fragment''s cache slots along with its phases, so every context.cache call written against the unprefixed name goes red at compile time and needs the "As / PhaseName" form instead — a safety net, but still a real edit an agent has to make when adding `as` to an existing mount.'
        wrong_pattern: |
          .use(pullChannel, { as: "Amazon" })
          // elsewhere: cache.clear("Fetch")  — now a compile error, slot is "Amazon / Fetch"
        correct_pattern: |
          .use(pullChannel, { as: "Amazon" })
          // elsewhere: cache.clear("Amazon / Fetch")
        source: 'docs/guides/reusable-scripts.md ("Mounting twice"); docs/guides/caching.md ("Reaching the cache from a step")'
        priority: 'LOW'
        status: 'active'
        skills: ['reusable-routines-and-mounts', 'caching-expensive-work']
      - mistake: 'assuming a mount''s input mapper is re-evaluated per step inside the fragment'
        mechanism: 'input is resolved once per mount, at the moment the mount is reached in execution order, and every phase/step of that fragment — including when and rollback — sees that single resolved value, not a fresh evaluation each time.'
        wrong_pattern: |
          .use(pullChannel, { input: ({ input }) => ({ apiKey: getFreshToken() }) })
          // assumed: getFreshToken() called again for each step in the fragment — it is called exactly once
        correct_pattern: |
          // if freshness matters per step, resolve it inside the fragment's own step handlers instead of the mount mapper
        source: 'docs/guides/reusable-scripts.md ("resolved once per mount, at the moment the mount is reached")'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Handling results and errors'
    slug: 'handling-results-and-errors'
    domain: 'errors-results'
    description: 'The RunResult discriminated union, every exported error class and what triggers it, and isAbort for telling cancellation apart from an ordinary failure.'
    type: 'core'
    covers:
      - 'RunResult<Ctx> (ok: true | false)'
      - 'StepFailedError / StepTimeoutError / ScriptAbortedError / RollbackFailedError / CacheShapeError'
      - 'isAbort(error)'
      - 'throwOnError'
    tasks:
      - 'branch correctly on a failed run'
      - 'tell a Ctrl-C cancellation apart from a real handler failure'
      - 'get the phase/step name a failure happened at'
    failure_modes:
      - mistake: 'checking result.error instanceof StepFailedError to get the phase/step/attempts'
        mechanism: 'result.error on a failed run is the original value the handler threw, not automatically wrapped in StepFailedError — that class exists for callers building their own reporting elsewhere. The phase/step is available on result.failedAt instead.'
        wrong_pattern: |
          if (!result.ok && result.error instanceof StepFailedError) {
            console.error(result.error.step, result.error.attempts); // never true — error is the raw throw
          }
        correct_pattern: |
          if (!result.ok) {
            console.error(result.failedAt?.phase, result.failedAt?.step, result.error);
          }
        source: 'docs/reference/errors.md ("result.error on a failed run is the original thrown value, not automatically wrapped in this type")'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'assuming throwOnError skips compensation and fails fast'
        mechanism: 'throwOnError only changes how the outcome is reported — a failing run rejects with the original error instead of resolving { ok: false }. Compensation still runs first, in full, before the rejection.'
        wrong_pattern: |
          // assumed: throwOnError means "don't bother rolling back, just blow up immediately"
          new Script({ name: "t", throwOnError: true })
        correct_pattern: |
          // rollbacks still run to completion; throwOnError only affects how the caller is told about the outcome
          new Script({ name: "t", throwOnError: true }) // reach for this when the script is one stage inside a larger error-handling flow
        source: 'docs/guides/script-options-and-result.md ("Compensation still runs before the rejection")'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'catching RollbackFailedError from run() or its result'
        mechanism: 'RollbackFailedError is exported for a caller''s own reporting, but the library itself never throws it or puts it in RunResult — a failing rollback is instead recorded as { ok: false, error } inside result.rollbacks.'
        wrong_pattern: |
          try {
            await script.run(input);
          } catch (e) {
            if (e instanceof RollbackFailedError) { /* never matches */ }
          }
        correct_pattern: |
          const result = await script.run(input);
          if (!result.ok) {
            const failedRollbacks = result.rollbacks.filter((r) => !r.ok);
          }
        source: 'docs/reference/errors.md ("a failing rollback does not propagate as this error type through RunResult")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['handling-results-and-errors', 'adding-rollbacks']
      - mistake: 'treating any Error named "AbortError" as proof the script itself was cancelled'
        mechanism: 'isAbort(error) returns true for a ScriptAbortedError or any Error named "AbortError" — including one thrown by unrelated code inside a handler (e.g. a hand-rolled fetch timeout), not just Stagehand''s own signal.'
        wrong_pattern: |
          if (!result.ok && isAbort(result.error)) {
            console.log("user pressed Ctrl-C");  // could actually be an unrelated internal AbortError
          }
        correct_pattern: |
          if (!result.ok && isAbort(result.error) && result.status === "aborted") {
            console.log("cancelled");
          }
        source: 'src/errors.ts isAbort(); docs/guides/rollbacks.md ("Signals and cancellation")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['handling-results-and-errors', 'adding-rollbacks']

tensions:
  - name: 'Caching speed vs. compensation guarantees'
    skills: ['caching-expensive-work', 'adding-rollbacks']
    description: 'Cached work never actually runs on a hit, so its rollback can never fire during a later unwind — caching a phase for speed or rate-limit safety quietly removes it from the saga''s compensation guarantee.'
    implication: 'an agent optimizing an already-rollback-protected phase by adding cache: store weakens the script''s safety without any warning; it should be an explicit tradeoff, not a drive-by performance tweak.'

  - name: 'Simple first draft vs. rollbackKeys reservation permanence'
    skills: ['getting-started', 'adding-rollbacks', 'cleaning-context']
    description: 'The simplest script has no rollbackKeys and no clean conflicts. The moment a rollback is added to "harden" a working script, any rollbackKeys it declares permanently lock those keys from clean everywhere else in the script, for the rest of its life.'
    implication: 'an agent asked to "add a rollback" to an already-working script may need to revisit unrelated clean calls elsewhere that now throw StepDefinitionError, which reads as an unrelated regression if the connection to rollbackKeys is not understood.'

  - name: 'Rich live observability vs. complete log record'
    skills: ['reporting-progress', 'log-placement-and-rendering']
    description: 'logPlacement "step"/"bottom" produce the most pleasant live-TTY experience by capping what they retain; "scrollback" is the only placement that is both complete and the default. One choice applies to the whole script.'
    implication: 'an agent cannot have a beautifully-nested live view and a guaranteed-complete CI/audit trail from the same logPlacement setting; the tradeoff has to be made explicitly, and reached for per use case rather than left at a locally-nice-looking default.'

  - name: 'Routine authoring instincts vs. host-controlled ScriptOptions'
    skills: ['reusable-routines-and-mounts', 'adding-rollbacks', 'log-placement-and-rendering']
    description: 'A routine is built as an ordinary Script, which makes it natural to set rollback/logPlacement/silent on it as if authoring a standalone safety policy — but every one of those is discarded the moment it is mounted; only the host''s own ScriptOptions ever apply.'
    implication: 'an agent writing a reusable routine cannot bake in "this fragment is always non-destructive" via rollback: "none" on the sub-script; that has to be documented as a requirement on whoever mounts it instead.'

cross_references:
  - from: 'getting-started'
    to: 'handling-results-and-errors'
    reason: 'the very first script already needs correct RunResult handling — run() resolving instead of throwing is the single most consequential thing to get right early.'
  - from: 'adding-rollbacks'
    to: 'cleaning-context'
    reason: 'rollbackKeys and clean share one reservation mechanism; writing a rollback without knowing this leads to confusing StepDefinitionErrors elsewhere in the script.'
  - from: 'adding-rollbacks'
    to: 'caching-expensive-work'
    reason: 'cached work never rolls back — anyone reasoning about compensation coverage needs to know which phases are cache-exempt from it.'
  - from: 'caching-expensive-work'
    to: 'reusable-routines-and-mounts'
    reason: 'cache slots travel with a mount and get renamed by `as`, which changes every context.cache call written against the routine.'
  - from: 'conditional-steps'
    to: 'reusable-routines-and-mounts'
    reason: 'when inside a mounted fragment evaluates against the mount''s resolved input, not the host''s — easy to miss without reading both.'
  - from: 'reusable-routines-and-mounts'
    to: 'structuring-phases-and-steps'
    reason: 'a routine owns whole phases; addStep directly after use() is refused, which only makes sense once phase ownership is understood.'
  - from: 'reporting-progress'
    to: 'log-placement-and-rendering'
    reason: 'where status/note/log actually render depends entirely on logPlacement and which renderer is active — the two skills describe one mechanism from two ends.'
  - from: 'handling-results-and-errors'
    to: 'adding-rollbacks'
    reason: 'isAbort and the retry loop''s abort check directly govern whether — and how fast — a rollback''s unwind gets triggered.'
  - from: 'typed-context-and-input'
    to: 'cleaning-context'
    reason: 'mutating ctx directly instead of returning it from a handler is the same "context is not just a plain mutable object" mental model both skills depend on.'

